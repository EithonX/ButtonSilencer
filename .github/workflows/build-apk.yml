name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check project configuration
        run: ./scripts/check-project-config.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Preflight manifests and AIDL
        run: gradle --no-daemon --stacktrace -PversionCode=$((200000 + GITHUB_RUN_NUMBER)) clean :app:processDebugMainManifest :app:processReleaseMainManifest :app:compileDebugAidl :app:compileReleaseAidl

      - name: Run unit tests and lint
        run: gradle --no-daemon --stacktrace -PversionCode=$((200000 + GITHUB_RUN_NUMBER)) testDebugUnitTest lintDebug lintRelease

      - name: Build signed debug and minified release APKs
        run: gradle --no-daemon --stacktrace -PversionCode=$((200000 + GITHUB_RUN_NUMBER)) assembleDebug assembleRelease

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ButtonSilencer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ButtonSilencer-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ButtonSilencer-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ButtonSilencer-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ButtonSilencer-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
