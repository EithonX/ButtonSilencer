name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check project configuration
        shell: bash
        run: bash scripts/check-project-config.sh

      - name: Set build version
        shell: bash
        run: |
          set -euo pipefail
          echo "VERSION_CODE=$((313000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            if sdkmanager \
              'platform-tools' \
              'platforms;android-36' \
              'build-tools;35.0.0'; then
              success=1
              break
            fi
            echo "sdkmanager attempt $attempt failed" >&2
            sleep $((attempt * 5))
          done
          test "$success" -eq 1
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --version
          echo "VERSION_CODE=$VERSION_CODE"

      - name: Compile, test, lint, and build APKs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci
          gradle --no-daemon --stacktrace --continue --console=plain \
            -PversionCode="$VERSION_CODE" \
            clean \
            testDebugUnitTest \
            lintDebug \
            lintRelease \
            assembleDebug \
            assembleRelease \
            2>&1 | tee .ci/gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$debug_apk"
          test -s "$release_apk"

          mkdir -p dist
          cp "$debug_apk" dist/ButtonSilencer-debug.apk
          cp "$release_apk" dist/ButtonSilencer-release.apk

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/ButtonSilencer-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/ButtonSilencer-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ButtonSilencer-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ButtonSilencer-release.apk

          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          du -h dist/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ButtonSilencer-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ButtonSilencer-build-reports
          path: |
            .ci/gradle.log
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
