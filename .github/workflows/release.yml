name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 3.2.0-rc.1). Leave blank for appVersion.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^appVersion=//p' gradle.properties)"
          base_code="$(sed -n 's/^appVersionCode=//p' gradle.properties)"
          test -n "$base_version"
          [[ "$base_code" =~ ^[0-9]+$ ]]

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${REQUESTED_VERSION:-}" ]]; then
            release_version="$REQUESTED_VERSION"
          else
            release_version="$base_version"
          fi

          if [[ "$release_version" == "$base_version" ]]; then
            version_code="$base_code"
            prerelease=false
          elif [[ "$release_version" =~ ^${base_version//./\\.}-(alpha|beta|rc)\.([1-9][0-9]?)$ ]]; then
            channel="${BASH_REMATCH[1]}"
            sequence="${BASH_REMATCH[2]}"
            case "$channel" in
              alpha) offset=300 ;;
              beta)  offset=200 ;;
              rc)    offset=100 ;;
            esac
            version_code=$((base_code - offset + sequence))
            prerelease=true
          else
            echo "Version must be $base_version or $base_version-{alpha,beta,rc}.N (N=1..99)." >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "v$release_version"
          fi

          if ! grep -Fqx "## [$release_version]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing: ## [$release_version]" >&2
            exit 1
          fi

          echo "APP_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "app_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify native libraries
        run: bash scripts/verify-native-libs.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/button-silencer-release.p12"
          keytool -list \
            -keystore "$RUNNER_TEMP/button-silencer-release.p12" \
            -storetype PKCS12 \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        shell: bash
        env:
          BUTTON_SILENCER_KEYSTORE: ${{ runner.temp }}/button-silencer-release.p12
          BUTTON_SILENCER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BUTTON_SILENCER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BUTTON_SILENCER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain \
            -PversionName="$APP_VERSION" \
            -PversionCode="$VERSION_CODE" \
            clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          mkdir -p dist
          cp "$apk" "dist/ButtonSilencer-$APP_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "dist/ButtonSilencer-$APP_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "dist/ButtonSilencer-$APP_VERSION.apk" \
            | tee dist/SIGNING_CERTIFICATE.txt
          sha256sum "dist/ButtonSilencer-$APP_VERSION.apk" > dist/SHA256SUMS.txt

          awk -v heading="## [$APP_VERSION]" '
            $0 == heading { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md

      - name: Upload signed release package
        uses: actions/upload-artifact@v7
        with:
          name: ButtonSilencer-signed-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/button-silencer-release.p12"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release package
        uses: actions/download-artifact@v8
        with:
          name: ButtonSilencer-signed-${{ github.run_number }}
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "dist/ButtonSilencer-$APP_VERSION.apk" \
            dist/SHA256SUMS.txt \
            "${release_flags[@]}"
