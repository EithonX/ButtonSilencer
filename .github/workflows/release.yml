name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^appVersion=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify native libraries
        run: bash scripts/verify-native-libs.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/button-silencer-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          BUTTON_SILENCER_KEYSTORE: ${{ runner.temp }}/button-silencer-release.jks
          BUTTON_SILENCER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BUTTON_SILENCER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BUTTON_SILENCER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain \
            clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          mkdir -p dist
          cp "$apk" "dist/ButtonSilencer-$APP_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "dist/ButtonSilencer-$APP_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/ButtonSilencer-$APP_VERSION.apk"
          sha256sum "dist/ButtonSilencer-$APP_VERSION.apk" > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/ButtonSilencer-$APP_VERSION.apk" \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Button Silencer $APP_VERSION" \
            --generate-notes

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/button-silencer-release.jks"
