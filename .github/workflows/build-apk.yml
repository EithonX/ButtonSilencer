name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests and Android lint
        run: gradle --no-daemon --stacktrace -PversionCode=${{ github.run_number }} clean testDebugUnitTest lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PversionCode=${{ github.run_number }} assembleDebug

      - name: Prepare installable APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ButtonSilencer-debug.apk
          sha256sum dist/ButtonSilencer-debug.apk > dist/ButtonSilencer-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ButtonSilencer-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
