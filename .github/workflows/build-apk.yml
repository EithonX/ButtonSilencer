name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify native libraries
        run: bash scripts/verify-native-libs.sh

      - name: Set build version
        shell: bash
        run: |
          set -euo pipefail
          base="$(sed -n 's/^appVersionCode=//p' gradle.properties)"
          [[ "$base" =~ ^[0-9]+$ ]]
          echo "VERSION_CODE=$((base + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Test, lint, and build
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci
          gradle --no-daemon --stacktrace --continue --console=plain \
            -PversionCode="$VERSION_CODE" \
            clean \
            testDebugUnitTest \
            lintDebug \
            lintRelease \
            assembleDebug \
            assembleRelease \
            2>&1 | tee .ci/gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$debug_apk"
          test -s "$release_apk"

          mkdir -p dist
          cp "$debug_apk" dist/ButtonSilencer-debug.apk
          cp "$release_apk" dist/ButtonSilencer-release-unsigned.apk

          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/ButtonSilencer-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ButtonSilencer-ci-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ButtonSilencer-build-reports-${{ github.run_number }}
          path: |
            .ci/gradle.log
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
