plugins {
    id 'com.android.application'
}

def ciVersionCode = (project.findProperty('versionCode') ?: '1').toInteger()
def testKeyStore = file('debug.keystore')

android {
    namespace 'com.buttons.silencer'
    compileSdk 36

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.buttons.silencer'
        minSdk 26
        targetSdk 36
        versionCode ciVersionCode
        versionName "3.0.1.${ciVersionCode}"
    }

    signingConfigs {
        testKey {
            storeFile testKeyStore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.testKey
        }
        release {
            signingConfig signingConfigs.testKey
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
